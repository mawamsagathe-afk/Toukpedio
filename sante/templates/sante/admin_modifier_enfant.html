<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Modifier {{ enfant.prenom }}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">

            <i class="bi bi-speedometer2 me-2"></i>

            TOUKPEDIO ADMIN

        </span>

    </div>

</nav>


<div class="container py-5">

    <div class="card border-0 shadow-sm">

        <div class="card-header bg-success text-white">

            <h4 class="mb-0">

                <i class="bi bi-pencil-square me-2"></i>

                Modifier le dossier de
                {{ enfant.prenom }}
                {{ enfant.nom }}

            </h4>

        </div>


        <div class="card-body">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}


                <div class="row g-3">


                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Prénom
                        </label>

                        <input
                            type="text"
                            name="prenom"
                            class="form-control"
                            value="{{ enfant.prenom }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Nom
                        </label>

                        <input
                            type="text"
                            name="nom"
                            class="form-control"
                            value="{{ enfant.nom }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Date de naissance
                        </label>

                        <input
                            type="date"
                            name="date_naissance"
                            class="form-control"
                            value="{{ enfant.date_naissance|date:'Y-m-d' }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Sexe
                        </label>

                        <select
                            name="sexe"
                            class="form-select"
                            required
                        >

                            <option value="M"
                                {% if enfant.sexe == "M" %}
                                    selected
                                {% endif %}
                            >
                                Masculin
                            </option>

                            <option value="F"
                                {% if enfant.sexe == "F" %}
                                    selected
                                {% endif %}
                            >
                                Féminin
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Groupe sanguin
                        </label>

                        <input
                            type="text"
                            name="groupe_sanguin"
                            class="form-control"
                            value="{{ enfant.groupe_sanguin }}"
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Téléphone parent
                        </label>

                        <input
                            type="text"
                            name="telephone_parent"
                            class="form-control"
                            value="{{ enfant.telephone_parent }}"
                        >

                    </div>


                    <div class="col-12">

                        <label class="form-label fw-bold">
                            Adresse
                        </label>

                        <textarea
                            name="adresse"
                            class="form-control"
                            rows="2"
                        >{{ enfant.adresse }}</textarea>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Allergies
                        </label>

                        <textarea
                            name="allergies"
                            class="form-control"
                            rows="4"
                        >{{ enfant.allergies }}</textarea>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Antécédents
                        </label>

                        <textarea
                            name="antecedents"
                            class="form-control"
                            rows="4"
                        >{{ enfant.antecedents }}</textarea>

                    </div>


                    <div class="col-12">

                        <label class="form-label fw-bold">
                            Traitement général
                        </label>

                        <textarea
                            name="traitement"
                            class="form-control"
                            rows="4"
                        >{{ enfant.traitement }}</textarea>

                    </div>


                    <div class="col-12">

                        <label class="form-label fw-bold">
                            Observations
                        </label>

                        <textarea
                            name="observations"
                            class="form-control"
                            rows="4"
                        >{{ enfant.observations }}</textarea>

                    </div>


                    <div class="col-12">

                        <label class="form-label fw-bold">
                            Photo
                        </label>

                        <input
                            type="file"
                            name="photo"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>

                </div>


                <hr class="my-4">


                <div class="d-flex justify-content-between">

                    <a
                        href="{% url 'sante:administration_enfant_detail' enfant.id %}"
                        class="btn btn-outline-secondary"
                    >

                        <i class="bi bi-x-circle me-1"></i>

                        Annuler

                    </a>


                    <button
                        type="submit"
                        class="btn btn-success"
                    >

                        <i class="bi bi-check-circle me-1"></i>

                        Enregistrer les modifications

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
