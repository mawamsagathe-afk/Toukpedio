{% extends 'sante/base.html' %}

{% block title %}Connexion admin - Toukpedio{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="icon-box bg-danger-subtle text-danger mx-auto" style="width:70px;height:70px;font-size:2rem;">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <h2 class="fw-bold mt-3">Connexion admin</h2>
                        <p class="text-muted">Accédez à l’espace d’administration.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Nom d'utilisateur</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" id="username" class="form-control" placeholder="Nom d'utilisateur" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" id="password" class="form-control" placeholder="Mot de passe" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Se connecter
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'sante:accueil' %}" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>
                            Retour à l'accueil
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
