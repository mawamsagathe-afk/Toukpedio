{% extends "sante/base.html" %}

{% block title %}
Supprimer le suivi - TOUKPEDIO
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card border-0 shadow">

                <div class="card-body p-5 text-center">

                    <i class="bi bi-exclamation-triangle text-danger fs-1"></i>

                    <h3 class="mt-3">
                        Supprimer ce suivi ?
                    </h3>

                    <p class="text-muted">

                        Symptôme :
                        <strong>
                            {{ suivi.symptome }}
                        </strong>

                        <br>

                        Date :
                        <strong>
                            {{ suivi.date|date:"d/m/Y" }}
                        </strong>

                    </p>


                    <form method="POST">

                        {% csrf_token %}

                        <div class="d-flex justify-content-center gap-2">

                            <a
                                href="{% url 'sante:dossier_enfant' suivi.enfant.id %}"
                                class="btn btn-outline-secondary rounded-pill px-4"
                            >
                                Annuler
                            </a>

                            <button
                                type="submit"
                                class="btn btn-danger rounded-pill px-4"
                            >
                                <i class="bi bi-trash me-2"></i>
                                Supprimer
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
